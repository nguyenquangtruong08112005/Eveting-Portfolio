# Docs monorepo only (apps live in separate repos under server/, web/, …).
# App CI: server/.github/workflows/* and web/.github/workflows/*
name: Docs monorepo CI

on:
  push:
    branches: [staging, master, main]
  pull_request:
    branches: [staging, master, main]

jobs:
  docs-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure deploy entrypoints exist
        run: |
          test -f scripts/dev-up.ps1
          test -f deploy/README.md
          test -f package.json
          test -f NAMING.md
