# Manual deploy: optional Terraform infra → build images → push ECR → optional Ansible rollout.
# Terraform creates AWS infra; Ansible deploys app/runtime config to the EC2 host.
name: Deploy AWS (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      run_terraform:
        description: "run terraform apply"
        type: boolean
        default: true
      run_ansible:
        description: "run ansible deploy"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    if: ${{ inputs.run_terraform }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      ansible_inventory: ${{ steps.tf_outputs.outputs.ansible_inventory }}
      ecr_registry: ${{ steps.tf_outputs.outputs.ecr_registry }}
      ssm_transfer_bucket: ${{ steps.tf_outputs.outputs.ssm_transfer_bucket }}
    defaults:
      run:
        working-directory: server/infra/terraform
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      TF_VAR_web_domain: ${{ secrets.WEB_DOMAIN || 'eventing.moteo.fun' }}
      TF_VAR_api_domain: ${{ secrets.API_DOMAIN || 'api.eventing.moteo.fun' }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      - name: Derive AWS Account ID and State Bucket Name
        id: state_bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          AWS_REGION="${{ secrets.AWS_REGION || 'ap-southeast-2' }}"
          BUCKET_NAME="eventing-tfstate-${ACCOUNT_ID}-${AWS_REGION}"
          echo "account_id=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "bucket_name=${BUCKET_NAME}" >> "$GITHUB_OUTPUT"
      - name: Idempotent Bootstrap of S3 Remote State Bucket
        working-directory: server/infra/terraform/bootstrap
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
          TF_VAR_environment: "shared"
        run: |
          STATE_BUCKET="${{ steps.state_bucket.outputs.bucket_name }}"
          AWS_REGION="${{ secrets.AWS_REGION || 'ap-southeast-2' }}"
          BOOTSTRAP_KEY="bootstrap/terraform.tfstate"

          terraform fmt -check

          if aws s3api head-object --bucket "$STATE_BUCKET" --key "$BOOTSTRAP_KEY" 2>/dev/null; then
            echo "Bootstrap state object s3://$STATE_BUCKET/$BOOTSTRAP_KEY exists. Initializing bootstrap with S3 backend..."
            terraform init -reconfigure \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="key=${BOOTSTRAP_KEY}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="encrypt=true" \
              -backend-config="use_lockfile=true"
            terraform validate
            terraform apply -auto-approve
          else
            echo "Bootstrap state object s3://$STATE_BUCKET/$BOOTSTRAP_KEY absent (first run). Initializing local bootstrap..."
            terraform init -backend=false
            terraform validate
            terraform apply -auto-approve
            echo "Migrating local bootstrap state to remote S3 backend s3://$STATE_BUCKET/$BOOTSTRAP_KEY..."
            terraform init -migrate-state -force-copy \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="key=${BOOTSTRAP_KEY}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="encrypt=true" \
              -backend-config="use_lockfile=true"
          fi
      - name: Initialize Main Terraform with S3 Backend
        run: |
          STATE_BUCKET="${{ steps.state_bucket.outputs.bucket_name }}"
          AWS_REGION="${{ secrets.AWS_REGION || 'ap-southeast-2' }}"
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=eventing/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan
      - run: terraform apply -auto-approve
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || inputs.environment == 'staging'
      - name: Capture Terraform outputs
        id: tf_outputs
        run: |
          {
            echo "ansible_inventory<<EOF"
            terraform output -raw ansible_inventory
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$(terraform output -raw ecr_registry)" >> "$GITHUB_OUTPUT"
          echo "ssm_transfer_bucket=$(terraform output -raw ssm_transfer_bucket)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: terraform
    if: ${{ always() && (!inputs.run_terraform || needs.terraform.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: eventing-api
        run: |
          docker build -t $REGISTRY/$IMAGE:${{ github.sha }} ./server
          docker tag $REGISTRY/$IMAGE:${{ github.sha }} $REGISTRY/$IMAGE:${{ inputs.environment }}
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:${{ inputs.environment }}

      - name: Build & push Web
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: eventing-web
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          docker build -t $REGISTRY/$IMAGE:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_API_URL=${API_URL:-https://api.example.com} \
            ./web
          docker tag $REGISTRY/$IMAGE:${{ github.sha }} $REGISTRY/$IMAGE:${{ inputs.environment }}
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:${{ inputs.environment }}

  ansible:
    needs: [terraform, build-and-push]
    if: ${{ always() && inputs.run_ansible && needs.build-and-push.result == 'success' && (!inputs.run_terraform || needs.terraform.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      - name: Get ECR login password
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password --region $AWS_REGION)"
          echo "::add-mask::$ECR_PASSWORD"
          echo "ECR_PASSWORD=$ECR_PASSWORD" >> "$GITHUB_ENV"
      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          rm -f session-manager-plugin.deb
      - name: Run Ansible via SSM
        working-directory: server/infra/ansible
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
          ECR_REGISTRY: ${{ needs.terraform.outputs.ecr_registry || secrets.ECR_REGISTRY }}
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN || 'eventing.moteo.fun' }}
          API_DOMAIN: ${{ secrets.API_DOMAIN || 'api.eventing.moteo.fun' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'https://eventing.moteo.fun' }}
          PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.eventing.moteo.fun' }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          JWT_TICKET_SECRET: ${{ secrets.JWT_TICKET_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AUTH_MOCK_EMAIL: ${{ secrets.AUTH_MOCK_EMAIL }}
          ZALOPAY_APP_ID: ${{ secrets.ZALOPAY_APP_ID }}
          ZALOPAY_KEY1: ${{ secrets.ZALOPAY_KEY1 }}
          ZALOPAY_KEY2: ${{ secrets.ZALOPAY_KEY2 }}
          ZALOPAY_ENDPOINT: ${{ secrets.ZALOPAY_ENDPOINT }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_URL_BASE: ${{ secrets.S3_PUBLIC_URL_BASE }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          LOG_LEVEL: info
          LOG_CONSOLE: "true"
          TERRAFORM_ANSIBLE_INVENTORY: ${{ needs.terraform.outputs.ansible_inventory }}
        run: |
          if [ "${{ inputs.run_terraform }}" = "true" ]; then
            printf '%s\n' "$TERRAFORM_ANSIBLE_INVENTORY" > inventory.ini
          else
            echo "${{ secrets.ANSIBLE_INVENTORY }}" > inventory.ini
          fi
          pip install boto3 botocore ansible
          ansible-galaxy collection install amazon.aws
          ansible-playbook -i inventory.ini playbook.yml --tags common,app --extra-vars "image_tag=${{ github.sha }} environment=${{ inputs.environment }} aws_region=$AWS_REGION"
