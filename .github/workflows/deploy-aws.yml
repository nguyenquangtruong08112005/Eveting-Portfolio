# Manual deploy: optional Terraform infra → build images → push ECR → optional Ansible rollout.
# Terraform creates AWS infra; Ansible deploys app/runtime config to the EC2 host.
name: Deploy AWS (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      instance_type:
        description: "EC2 instance type for cost control"
        required: false
        default: "t3.small"
        type: choice
        options: [t3.small, t3.medium]
      run_terraform_plan:
        description: "run terraform plan"
        type: boolean
        default: true
      run_terraform_apply:
        description: "run terraform apply (requires plan)"
        type: boolean
        default: false
      run_build_push:
        description: "build and push container images to ECR"
        type: boolean
        default: false
      run_ansible:
        description: "run ansible deploy rollout to EC2 host"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    if: ${{ inputs.run_terraform_plan || inputs.run_terraform_apply }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      ssm_transfer_bucket: ${{ steps.tf_outputs.outputs.ssm_transfer_bucket }}
      bootstrap_only: ${{ steps.tf_outputs.outputs.bootstrap_only }}
    defaults:
      run:
        working-directory: server/infra/terraform
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_instance_type: ${{ inputs.instance_type || 't3.small' }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      TF_VAR_web_domain: ${{ secrets.WEB_DOMAIN || 'eventing.moteo.fun' }}
      TF_VAR_api_domain: ${{ secrets.API_DOMAIN || 'eventing-api.moteo.fun' }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      - name: Test Cloudflare R2 State Bucket Existence via REST API
        run: |
          STATE_BUCKET="${{ secrets.TF_STATE_R2_BUCKET || 'eventing-tfstate' }}"
          CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${STATE_BUCKET}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Cloudflare R2 state bucket '$STATE_BUCKET' exists."
            echo "R2_BUCKET_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Cloudflare R2 state bucket '$STATE_BUCKET' is absent (HTTP status $HTTP_STATUS)."
            echo "R2_BUCKET_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Idempotent Bootstrap of Cloudflare R2 State Bucket
        working-directory: server/infra/terraform/bootstrap
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_state_r2_bucket_name: ${{ secrets.TF_STATE_R2_BUCKET || 'eventing-tfstate' }}
        run: |
          terraform init
          terraform fmt -check
          terraform validate

          if [ "${R2_BUCKET_EXISTS}" = "true" ]; then
            echo "R2 state bucket exists. Skipping bootstrap plan & apply."
          else
            echo "R2 state bucket absent. Running bootstrap terraform plan..."
            terraform plan

            if [ "${{ inputs.run_terraform_apply }}" = "true" ]; then
              echo "Provisioning Cloudflare R2 state bucket via bootstrap apply..."
              terraform apply -auto-approve
              echo "BOOTSTRAP_JUST_APPLIED=true" >> "$GITHUB_ENV"
              echo "SKIP_MAIN_TF=true" >> "$GITHUB_ENV"
              echo "R2 state bucket created. OPERATOR ACTION REQUIRED: Create a bucket-scoped Object Read & Write R2 API Token in Cloudflare dashboard, add R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY to GitHub Secrets, then re-run workflow."
            else
              echo "run_terraform_apply is false; bootstrap apply skipped."
              echo "SKIP_MAIN_TF=true" >> "$GITHUB_ENV"
            fi
          fi
      - name: Initialize Main Terraform with Cloudflare R2 Backend
        run: |
          if [ "${SKIP_MAIN_TF}" = "true" ]; then
            echo "Skipping main Terraform initialization."
            exit 0
          fi

          STATE_BUCKET="${{ secrets.TF_STATE_R2_BUCKET || 'eventing-tfstate' }}"
          CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          R2_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
          R2_SECRET="${{ secrets.R2_SECRET_ACCESS_KEY }}"

          if [ -z "$R2_KEY_ID" ] || [ -z "$R2_SECRET" ]; then
            echo "Error: State bucket '$STATE_BUCKET' exists, but R2_ACCESS_KEY_ID and/or R2_SECRET_ACCESS_KEY GitHub secrets are missing or empty."
            echo "OPERATOR INSTRUCTION: Create a bucket-scoped Object Read & Write R2 API Token in Cloudflare dashboard for '$STATE_BUCKET', then add R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY to GitHub Secrets."
            exit 1
          fi

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=eventing/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="endpoints={s3=\"${R2_ENDPOINT}\"}" \
            -backend-config="access_key=${R2_KEY_ID}" \
            -backend-config="secret_key=${R2_SECRET}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true" \
            -backend-config="use_lockfile=true"
      - name: Main Terraform Plan & Apply
        run: |
          if [ "${SKIP_MAIN_TF}" = "true" ]; then
            echo "Skipping main Terraform plan/apply."
            exit 0
          fi
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan
          if [ "${{ inputs.run_terraform_apply }}" = "true" ] && { [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ] || [ "${{ inputs.environment }}" = "staging" ]; }; then
            echo "Applying main Terraform infrastructure from tfplan..."
            terraform apply -auto-approve tfplan
          else
            echo "run_terraform_apply is false; main apply skipped."
          fi
      - name: Capture Terraform outputs
        id: tf_outputs
        run: |
          if [ "${SKIP_MAIN_TF}" = "true" ] || [ "${BOOTSTRAP_JUST_APPLIED}" = "true" ]; then
            echo "bootstrap_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap_only=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${SKIP_MAIN_TF}" = "true" ] || [ "${{ inputs.run_terraform_apply }}" != "true" ]; then
            echo "Main Terraform apply did not run; setting empty output values."
            echo "ssm_transfer_bucket=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ssm_transfer_bucket=$(terraform output -raw ssm_transfer_bucket 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: terraform
    if: ${{ always() && inputs.run_build_push && needs.terraform.outputs.bootstrap_only != 'true' && (!inputs.run_terraform_plan && !inputs.run_terraform_apply || needs.terraform.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [ -z "$REGISTRY" ]; then
            echo "Error: ECR registry from login action is empty."
            exit 1
          fi

          IMAGE="eventing-api"
          docker build -t $REGISTRY/$IMAGE:${{ github.sha }} -t $REGISTRY/$IMAGE:${{ inputs.environment }} ./server
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:${{ inputs.environment }}

          IMAGE="eventing-web"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://eventing-api.moteo.fun' }} \
            -t $REGISTRY/$IMAGE:${{ github.sha }} \
            -t $REGISTRY/$IMAGE:${{ inputs.environment }} \
            ./web
          docker push $REGISTRY/$IMAGE:${{ github.sha }}
          docker push $REGISTRY/$IMAGE:${{ inputs.environment }}

  ansible:
    needs: [terraform, build-and-push]
    if: ${{ always() && inputs.run_ansible && inputs.run_build_push && needs.build-and-push.result == 'success' && needs.terraform.outputs.bootstrap_only != 'true' && (!inputs.run_terraform_plan && !inputs.run_terraform_apply || needs.terraform.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      - name: Get ECR login password
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password --region $AWS_REGION)"
          echo "::add-mask::$ECR_PASSWORD"
          echo "ECR_PASSWORD=$ECR_PASSWORD" >> "$GITHUB_ENV"
      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          rm -f session-manager-plugin.deb
      - name: Run Ansible via SSM
        working-directory: server/infra/ansible
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN || 'eventing.moteo.fun' }}
          API_DOMAIN: ${{ secrets.API_DOMAIN || 'eventing-api.moteo.fun' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'https://eventing.moteo.fun' }}
          PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://eventing-api.moteo.fun' }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          JWT_TICKET_SECRET: ${{ secrets.JWT_TICKET_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AUTH_MOCK_EMAIL: ${{ secrets.AUTH_MOCK_EMAIL }}
          ZALOPAY_APP_ID: ${{ secrets.ZALOPAY_APP_ID }}
          ZALOPAY_KEY1: ${{ secrets.ZALOPAY_KEY1 }}
          ZALOPAY_KEY2: ${{ secrets.ZALOPAY_KEY2 }}
          ZALOPAY_ENDPOINT: ${{ secrets.ZALOPAY_ENDPOINT }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PUBLIC_URL_BASE: ${{ secrets.S3_PUBLIC_URL_BASE }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          LOG_LEVEL: info
          LOG_CONSOLE: "true"
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          export ECR_REGISTRY="${REGISTRY}"

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=eventing" "Name=tag:Environment,Values=${{ inputs.environment }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"

          SSM_BUCKET="eventing-${{ inputs.environment }}-ssm-transfer-${ACCOUNT_ID}"

          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "Error: No running EC2 instance found for Project=eventing, Environment=${{ inputs.environment }}. Cannot proceed with inventory creation."
            exit 1
          fi

          if [ -z "${SSM_BUCKET}" ]; then
            echo "Error: SSM transfer bucket 'eventing-${{ inputs.environment }}-ssm-transfer-${ACCOUNT_ID}' not resolvable. Cannot proceed with inventory creation."
            exit 1
          fi

          echo "Waiting for EC2 instance ${INSTANCE_ID} to reach SSM Online status..."
          SSM_ONLINE=false
          for attempt in $(seq 1 18); do
            STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)"
            if [ "${STATUS}" = "Online" ]; then
              echo "EC2 instance ${INSTANCE_ID} is SSM Online (attempt ${attempt}/18)."
              SSM_ONLINE=true
              break
            fi
            echo "Attempt ${attempt}/18: SSM ping status is '${STATUS:-Offline/Unregistered}'. Waiting 10s..."
            sleep 10
          done

          if [ "${SSM_ONLINE}" != "true" ]; then
            echo "Error: EC2 instance ${INSTANCE_ID} did not reach SSM Online status within 180 seconds."
            exit 1
          fi

          cat > inventory.ini << EOFINVENTORY
          [app_servers]
          ${INSTANCE_ID} ansible_connection=amazon.aws.aws_ssm ansible_user=ubuntu

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          ansible_remote_tmp=/tmp/.ansible-eventing/tmp
          ansible_aws_ssm_bucket_name=${SSM_BUCKET}
          ansible_aws_ssm_bucket_sse_mode=AES256
          ansible_aws_ssm_region=${AWS_REGION}
          web_domain=${WEB_DOMAIN}
          api_domain=${API_DOMAIN}
          environment=${{ inputs.environment }}
          project_root=/opt/server-eventing
          EOFINVENTORY

          pip install boto3 botocore ansible
          ansible-galaxy collection install amazon.aws
          ansible-playbook -i inventory.ini playbook.yml --tags common,app --extra-vars "image_tag=${{ github.sha }} environment=${{ inputs.environment }} aws_region=${AWS_REGION}"
