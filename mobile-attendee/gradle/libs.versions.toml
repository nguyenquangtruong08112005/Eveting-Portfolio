[versions]
agp = "8.13.0"
coilCompose = "2.4.0"
converterGson = "2.9.0"
coreSplashscreen = "1.0.1"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.3"
activityCompose = "1.11.0"
composeBom = "2024.09.00"
firebase-bom = "34.2.0" #Phiên bản firebase bom
hilt = "2.57.1"               # Phiên bản hilt dùng cho di
loggingInterceptor = "4.11.0"
lottieCompose = "6.4.1"
navigation = "2.9.4"         # Navigation compose version
hilt-navigation-compose = "1.3.0" # Thư viện tích hợp Navigation + Hilt trong Compose
mpandroidchart = "v3.1.0"
foundation = "1.9.1"
okhttp = "4.11.0"
room = "2.6.1"
datastore = "1.1.1"
firebaseCrashlyticsBuildtools = "3.0.6"
credentials = "1.6.0-alpha05"
googleid = "1.1.1"
facebookLogin = "latest.release"
foundationVersion = "1.9.2"
playServicesAuth = "21.2.0"
credentialsPlayServicesAuth = "1.6.0-alpha05"
googleidLibrary = "1.1.1"
materialIconsExtended = "1.6.8"
cloudinaryKotlin = "1.7.0"
animationCore = "1.9.2"
playServicesLocation = "21.3.0"
accompanist = "0.34.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Quản lí các thư viện firebase đồng bộ
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }

# SỬA LẠI TÊN ALIAS CHO ĐÚNG
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Annotation processor (cùng với kapt) để sinh code cho Hilt
hilt-compiler = { group = "com.google.dagger" , name = "hilt-android-compiler", version.ref = "hilt" }

# Navigation dành riêng cho Compose
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# Kết hop giữa Hilt và Navigation trong Compose
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
# Thư viện vẽ biểu đồ
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottieCompose" }
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }

# Thư viện Room cho CSDL local
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "converterGson" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
firebase-crashlytics-buildtools = { group = "com.google.firebase", name = "firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }

# Thư viện cho Credential Manager và Google Sign In
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-playservices = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentialsPlayServicesAuth" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleidLibrary" }

# Thư viện Facebook Login
facebook-login = { group = "com.facebook.android", name = "facebook-login", version.ref = "facebookLogin" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundationVersion" }

play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
cloudinary-kotlin = { group = "com.cloudinary", name = "kotlin-url-gen", version.ref = "cloudinaryKotlin" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "animationCore" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Plugin để tự động cấu hình firebase trong project Android
google-services = { id = "com.google.gms.google-services", version = "4.4.3" }

# Plugin Hilt cho Android - giúp tạo component và biding module tự động
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt"}


kotlin-ksp = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.22" }
