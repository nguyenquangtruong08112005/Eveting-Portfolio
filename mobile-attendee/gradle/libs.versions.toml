[versions]
agp = "8.13.0"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.3"
activityCompose = "1.11.0"
composeBom = "2024.09.00"
firebase-bom = "34.2.0" #Phiên bản firebase bom
hilt = "2.57.1"               # Phiên bản hilt dùng cho di
navigation = "2.9.4"         # Navigation compose version
hilt-navigation-compose = "1.3.0" # Thư viện tích hợp Navigation + Hilt trong Compose
mpandroidchart = "v3.1.0"
foundation = "1.9.1"
room = "2.6.1"
datastore = "1.1.1"
firebaseCrashlyticsBuildtools = "3.0.6"
credentials = "1.3.0"
googleid = "1.1.1"
facebookLogin = "latest.release"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Quản lí các thư viện firebase đồng bộ
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
# Thư viện Hilt chính dùng để inject các dependencies
hilt-core = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Annotation processor (cùng với kapt) để sinh code cho Hilt
hilt-compiler = { group = "com.google.dagger" , name = "hilt-android-compiler", version.ref = "hilt" }
# Navigation dành riêng cho Compose
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
# Kết hop giữa Hilt và Navigation trong Compose
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
# Thư viện vẽ biểu đồ
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }

# Thư viện Room cho CSDL local
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
firebase-crashlytics-buildtools = { group = "com.google.firebase", name = "firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }

# Thư viện cho Credential Manager và Google Sign In
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-playservices = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Thư viện Facebook Login
facebook-login = { group = "com.facebook.android", name = "facebook-login", version.ref = "facebookLogin" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Plugin để tự động cấu hình firebase trong project Android
google-services = { id = "com.google.gms.google-services", version = "4.4.3" }

# Plugin Hilt cho Android - giúp tạo component và biding module tự động
dagger-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt"}


kotlin-ksp = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.22" }
