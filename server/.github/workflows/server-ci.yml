name: Server CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci:check

  # =========================================================================
  # REPORT-ONLY SECURITY BASELINE
  #   Infra steps (checkout, setup-node, npm ci) are blocking.
  #   Scan steps use continue-on-error: true and are report-only until the
  #   dependency remediation slice flips them to blocking.  Known high/critical
  #   findings exist; this job is for visibility, not gating.
  # =========================================================================
  security-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report-Only - npm audit (omit dev, threshold high)
        continue-on-error: true
        run: npm run security:audit

      - name: Report-Only - Trivy filesystem scan (vuln, secret, misconfig)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table
